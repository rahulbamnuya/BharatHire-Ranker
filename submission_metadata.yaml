# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  We implemented a deterministic CPU-only ranking funnel for the 5-minute reproduction constraint.
  Stage 1 removes honeypots and implausible profiles using impossible dates, company founding years,
  overlapping histories, exaggerated expert skill claims, and experience inconsistencies. Stage 2 scores
  JD evidence from profile summaries, career descriptions, titles, companies, industries, and skills,
  rewarding production retrieval, vector search, ranking/recommendation systems, evaluation frameworks,
  Python, LLM/fine-tuning, and product-engineering signals while penalizing non-engineering or pure
  research/keyword-stuffed profiles. Stage 3 applies Redrob behavioral signals including response rate,
  response time, last activity, notice period, profile visibility, recruiter saves, assessments, GitHub,
  relocation, interview completion, offer acceptance, verification, and salary fit. The final CSV includes
  factual 1-2 sentence reasoning grounded in candidate fields.

